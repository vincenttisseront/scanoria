#
# osv-scanner (ci.yml, travail « osv-scanner »). Toute exception est DATÉE :
# identifiant, date de fin (ignoreUntil, au plus 90 jours) et motif vérifiable
# (code non atteignable, correctif absent en amont…). À l'échéance, la CI
# échoue de nouveau : corriger ou renouveler en le justifiant dans une PR.
#
# Modèle :
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-01-31
# reason = "dépendance de développement seulement, fonction vulnérable non appelée"
#

# nuxt / @nuxt/nitro-server 4.6.4 : dernière version publiée (npm, 2026-11-02).
# OSV la signale, mais la GitHub Advisory Database (npm audit) ne marque pas
# 4.6.4 comme affectée, et aucune version plus récente n'existe. La console
# n'écoute que sur 127.0.0.1 derrière nginx, réseaux d'administration seulement.
# À revoir à la prochaine version de nuxt ou à l'échéance.
[[IgnoredVulns]]
id = "GHSA-f3x9-2chm-73c8"
ignoreUntil = 2026-12-31
reason = "nuxt 4.6.4 = dernière version ; OSV la donne comme version corrigée ; npm audit ne la signale pas"

