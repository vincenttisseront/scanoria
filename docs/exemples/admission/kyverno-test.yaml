# kyverno test docs/exemples/admission/ : la politique se charge et ignore une
# image hors périmètre. La vérification d'une vraie attestation demande un
# registre joignable par Kyverno (voir docs/DEPLOIEMENT.md, limites).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scanoria-verdict
policies:
  - scanoria-attestation.yaml
resources:
  - pod-hors-perimetre.yaml
results:
  - policy: scanoria-verdict
    rule: attestation-scanoria
    resources:
      - outil-interne
    kind: Pod
    result: skip
