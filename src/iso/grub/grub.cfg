#
# Menu de démarrage du support d'installation de l'appliance Scanoria.
# L'entrée par défaut lance l'installation automatique : elle EFFACE le disque.
set timeout=30
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Installer l'appliance Scanoria (efface le disque) / Install the Scanoria appliance (erases the disk)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ console=tty1 ---
	initrd	/casper/initrd
}

menuentry "Démarrer sur le disque local / Boot from local disk" {
	exit 1
}

if [ "$grub_platform" = "efi" ]; then
	menuentry "Réglages du micrologiciel UEFI / UEFI firmware settings" {
		fwsetup
	}
fi
