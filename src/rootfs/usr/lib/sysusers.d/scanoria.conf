# Compte système de la console Scanoria (ARCHITECTURE § 3.1) : sans shell,
# maison /var/lib/scanoria/console. Groupe du même nom.
u scanoria - "Scanoria console" /var/lib/scanoria/console /usr/sbin/nologin
# Service IA (CLAUDE.md § 3.5) : seul compte autorisé à sortir vers le serveur
# Ollama externe (nftables, meta skuid). Sans maison ni shell.
u scanoria-ai - "Scanoria AI connector" /nonexistent /usr/sbin/nologin
