# Arborescence et droits de l'appliance (ARCHITECTURE § 3.2). Les résultats des
# demandes (done/, failed/) sont purgés après 30 jours, les écritures
# inachevées de la console (tmp/) après un jour.
d /etc/scanoria                         0750 root     scanoria -
d /etc/scanoria/pki                     0700 root     root     -
d /etc/scanoria/nftables                0700 root     root     -
d /var/lib/scanoria                     0750 root     scanoria -
d /var/lib/scanoria/console             0700 scanoria scanoria -
d /var/lib/scanoria/bootstrap           0700 scanoria scanoria -
d /var/lib/scanoria/requests            0750 root     scanoria -
d /var/lib/scanoria/requests/tmp        0700 scanoria scanoria 1d
d /var/lib/scanoria/requests/incoming   0700 scanoria scanoria -
d /var/lib/scanoria/requests/work       0700 root     root     -
d /var/lib/scanoria/requests/done       0750 root     scanoria 30d
d /var/lib/scanoria/requests/failed     0750 root     scanoria 30d
d /var/lib/scanoria/uploads             0700 scanoria scanoria 2d
d /var/lib/scanoria/updates             0700 root     root     -
d /var/lib/scanoria/backups             0700 root     root     -
d /var/lib/scanoria/backups/pre-update  0700 root     root     -
d /var/lib/scanoria/selftest            0750 root     scanoria -
d /var/lib/scanoria/public              0750 root     scanoria -
d /run/scanoria                         0750 root     scanoria -
d /var/lib/scanoria/routing             0750 root     scanoria -
d /var/lib/scanoria/dns                 0750 root     scanoria -
# Runner d'analyses (scanoria-runner) : la purge des résultats (24 h) et des
# espaces de travail est faite par le runner lui-même.
d /var/lib/scanoria/scans/jobs/work     0700 root     root     -
d /var/lib/scanoria/scans/results       0750 root     scanoria -
d /var/lib/scanoria/scans/workspaces    0700 root     root     -
