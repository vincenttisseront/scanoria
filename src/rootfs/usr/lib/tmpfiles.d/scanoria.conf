# Arborescence et droits de l'appliance (ARCHITECTURE § 3.2). Les résultats des
# demandes (done/, failed/) sont purgés après 30 jours, les écritures
# inachevées de la console (tmp/) après un jour.
d /etc/scanoria                         0750 root     scanoria -
d /etc/scanoria/pki                     0700 root     root     -
d /etc/scanoria/nftables                0700 root     root     -
d /var/lib/scanoria                     0750 root     scanoria -
d /var/lib/scanoria/console             0700 scanoria scanoria -
d /var/lib/scanoria/bootstrap           0700 scanoria scanoria -
d /var/lib/scanoria/requests            0750 root     scanoria -
d /var/lib/scanoria/requests/tmp        0700 scanoria scanoria 1d
d /var/lib/scanoria/requests/incoming   0700 scanoria scanoria -
d /var/lib/scanoria/requests/work       0700 root     root     -
d /var/lib/scanoria/requests/done       0750 root     scanoria 30d
d /var/lib/scanoria/requests/failed     0750 root     scanoria 30d
d /var/lib/scanoria/uploads             0700 scanoria scanoria 2d
d /var/lib/scanoria/updates             0700 root     root     -
d /var/lib/scanoria/backups             0700 root     root     -
d /var/lib/scanoria/backups/pre-update  0700 root     root     -
d /var/lib/scanoria/selftest            0750 root     scanoria -
d /var/lib/scanoria/public              0750 root     scanoria -
d /run/scanoria                         0750 root     scanoria -
# Valeurs lues une seule fois par la console (mot de passe admin d’un service) : effacées 2 minutes après leur dépôt par le helper (minuteur transitoire), tmpfiles en dernier recours.
d /run/scanoria/oneshot                 0750 root     scanoria 2m
d /var/lib/scanoria/routing             0750 root     scanoria -
d /var/lib/scanoria/dns                 0750 root     scanoria -
# Index du catalogue et état des modules, publiés par le helper, lus par la console.
d /var/lib/scanoria/catalog             0750 root     scanoria -
d /var/lib/scanoria/modules             0750 root     scanoria -
# File d'analyses (0.3, ARCHITECTURE § 12.2) : côté worker. Les tâches en
# cours d'écriture abandonnées depuis plus d'un jour sont purgées.
d /var/lib/scanoria/scans               0750 root     scanoria -
d /var/lib/scanoria/scans/jobs          0750 root     scanoria -
d /var/lib/scanoria/scans/jobs/tmp      0700 scanoria scanoria 1d
d /var/lib/scanoria/scans/jobs/incoming 0700 scanoria scanoria -
# 0.7 (G4, contrat 34) : versions des jeux de règles citées par les tâches, rangées par empreinte (le worker les réécrit au besoin).
d /var/lib/scanoria/scans/jobs/rulesets 0700 scanoria scanoria 30d
d /var/lib/scanoria/console/scan-logs   0700 scanoria scanoria -
# Runner d'analyses (scanoria-runner) : la purge des résultats (24 h) et des
# espaces de travail est faite par le runner lui-même.
d /var/lib/scanoria/scans/jobs/work     0700 root     root     -
d /var/lib/scanoria/scans/results       0750 root     scanoria -
d /var/lib/scanoria/scans/workspaces    0700 root     root     -
# Bases de vulnérabilités (0.3.4) : téléchargées par le helper, montées en
# lecture seule dans les conteneurs scanners (groupe 65534, fichiers 0640).
d /var/lib/scanoria/feeds               0700 root     root     -
# Bases exportées pour la console (0.5, contrat 17) : EPSS et KEV en jsonl.gz,
# écrites par le helper, lues par la console (groupe scanoria, fichiers 0640).
d /var/lib/scanoria/feeds-export        0750 root     scanoria -
# Hors ligne (0.6, chantier A, CLAUDE.md § 9) : clé de l'appliance et clés de
# confiance (root seul), lots exportés (lus par la console pour le
# téléchargement), état publié, fichiers du miroir F17 servis par nginx
# (lecture seule pour tous), bases servies aux modules permanents
# (Dependency-Track), répertoire de réception du client du miroir.
d /etc/scanoria/keys                    0700 root     root     -
d /etc/scanoria/trusted-keys            0700 root     root     -
d /var/lib/scanoria/bundles             0750 root     scanoria -
d /var/lib/scanoria/offline             0750 root     scanoria -
d /var/lib/scanoria/mirror-client       0710 root     scanoria-mirror -
d /var/lib/scanoria-mirror              0750 root     www-data -
d /var/lib/scanoria-feeds-mirror        0750 root     www-data -
# Vigilance (0.6, F19, G6, F13) : état publié par le helper (images retenues,
# SBOM et SARIF de l'appliance), lu par la console (groupe scanoria, 0640).
d /var/lib/scanoria/vigilance           0750 root     scanoria -
d /var/lib/scanoria/vigilance/self      0750 root     scanoria -
# Images retenues (versions figées, candidates d'un essai) et bancs d'essai
# vérifiés gardés pour les canaris hors ligne : root seul.
d /var/lib/scanoria/modules/retained    0700 root     root     -
d /var/lib/scanoria/modules/testbeds    0700 root     root     -
# Versions figées par projet (0.6, G6) : pins.json écrit par la console,
# lu sans confiance par le helper root (propriétaire scanoria vérifié).
d /var/lib/scanoria/pins                0750 scanoria scanoria -
# Relais IA des modules d'analyse par IA (0.7, contrat 31) : jetons éphémères
# déposés par le runner (root), lus par scanoria-ai sans pouvoir les écrire.
d /run/scanoria-relay                   0750 root     scanoria-ai -
d /run/scanoria-relay/tokens            0750 root     scanoria-ai -
