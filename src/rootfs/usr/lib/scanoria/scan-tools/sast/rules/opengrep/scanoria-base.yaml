#
# Règles maison de Scanoria pour Opengrep (et Semgrep CE, même syntaxe) :
# jeu de règles G4 de départ « scanoria-base ». Écrites pour Scanoria, sous
# AGPL-3.0-or-later ; aucune règle officielle Semgrep n'est reprise ici.
# Chaque règle porte metadata.cwe et metadata.severity (gravité normalisée
# proposée à la console, table G5 du module), et un id préfixé « scanoria- ».
rules:
  # ------------------------------------------------------------ Python
  - id: scanoria-python-subprocess-shell
    languages: [python]
    severity: ERROR
    message: Commande système lancée par un shell avec une valeur non constante (injection de commande).
    metadata: { cwe: "CWE-78", severity: high, category: injection }
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
      - pattern-not: subprocess.$F("...", ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...")
  - id: scanoria-python-eval
    languages: [python]
    severity: ERROR
    message: eval ou exec sur une valeur non constante (exécution de code arbitraire).
    metadata: { cwe: "CWE-95", severity: high, category: injection }
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
      - pattern-not: eval("...")
      - pattern-not: exec("...")
  - id: scanoria-python-pickle-load
    languages: [python]
    severity: ERROR
    message: Désérialisation pickle de données qui peuvent venir de l'extérieur (exécution de code au chargement).
    metadata: { cwe: "CWE-502", severity: high, category: deserialization }
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: dill.loads(...)
  - id: scanoria-python-yaml-load
    languages: [python]
    severity: ERROR
    message: yaml.load sans chargeur sûr (construction d'objets Python arbitraires).
    metadata: { cwe: "CWE-502", severity: high, category: deserialization }
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
  - id: scanoria-python-sql-format
    languages: [python]
    severity: ERROR
    message: Requête SQL construite par concaténation ou formatage de chaîne (injection SQL) ; utiliser des paramètres liés.
    metadata: { cwe: "CWE-89", severity: high, category: injection }
    pattern-either:
      - pattern: $C.execute("..." % ..., ...)
      - pattern: $C.execute("..." + ..., ...)
      - pattern: $C.execute(f"...", ...)
      - pattern: $C.execute("...".format(...), ...)
  - id: scanoria-python-hardcoded-password
    languages: [python]
    severity: WARNING
    message: Mot de passe ou jeton écrit en dur dans le code ; le lire depuis la configuration ou un coffre.
    metadata: { cwe: "CWE-798", severity: medium, category: secrets }
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $F(..., $NAME="$VALUE", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(password|passwd|pwd|secret|api_key|apikey|token|auth_token)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{6,}$
  - id: scanoria-python-requests-no-verify
    languages: [python]
    severity: WARNING
    message: Vérification du certificat TLS désactivée.
    metadata: { cwe: "CWE-295", severity: medium, category: crypto }
    pattern: requests.$M(..., verify=False, ...)
  # ------------------------------------------------------------ JavaScript / TypeScript
  - id: scanoria-js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval ou Function sur une valeur non constante (exécution de code arbitraire).
    metadata: { cwe: "CWE-95", severity: high, category: injection }
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")
  - id: scanoria-js-child-process
    languages: [javascript, typescript]
    severity: ERROR
    message: Commande système construite avec une valeur non constante (injection de commande) ; préférer execFile avec une liste d'arguments.
    metadata: { cwe: "CWE-78", severity: high, category: injection }
    patterns:
      - pattern: $CP.$EXEC($CMD, ...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$
      - metavariable-regex:
          metavariable: $CP
          regex: ^(child_process|childProcess|cp|proc)$
      - pattern-not: $CP.$EXEC("...", ...)
  - id: scanoria-js-sql-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: Requête SQL construite par concaténation ou gabarit de chaîne (injection SQL) ; utiliser des paramètres liés.
    metadata: { cwe: "CWE-89", severity: high, category: injection }
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X, ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.execute("..." + $X, ...)
          - pattern: $DB.execute(`...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $DB
          regex: (?i).*(db|pool|client|conn|connection|knex|sequelize|mysql|pg).*
  - id: scanoria-js-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: Contenu HTML non constant injecté dans la page (XSS) ; utiliser textContent ou un assainisseur.
    metadata: { cwe: "CWE-79", severity: medium, category: xss }
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: document.write("...")
  - id: scanoria-js-tls-reject-unauthorized
    languages: [javascript, typescript]
    severity: WARNING
    message: Vérification du certificat TLS désactivée.
    metadata: { cwe: "CWE-295", severity: medium, category: crypto }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  # ------------------------------------------------------------ Java
  - id: scanoria-java-runtime-exec
    languages: [java]
    severity: ERROR
    message: Commande système construite avec une valeur non constante (injection de commande).
    metadata: { cwe: "CWE-78", severity: high, category: injection }
    patterns:
      - pattern: Runtime.getRuntime().exec($X, ...)
      - pattern-not: Runtime.getRuntime().exec("...", ...)
  - id: scanoria-java-sql-concat
    languages: [java]
    severity: ERROR
    message: Requête SQL construite par concaténation (injection SQL) ; utiliser PreparedStatement.
    metadata: { cwe: "CWE-89", severity: high, category: injection }
    pattern-either:
      - pattern: (java.sql.Statement $S).executeQuery("..." + $X)
      - pattern: (java.sql.Statement $S).executeUpdate("..." + $X)
      - pattern: (java.sql.Statement $S).execute("..." + $X)
  - id: scanoria-java-object-input-stream
    languages: [java]
    severity: ERROR
    message: Désérialisation Java native (ObjectInputStream.readObject) de données qui peuvent venir de l'extérieur.
    metadata: { cwe: "CWE-502", severity: high, category: deserialization }
    pattern: (java.io.ObjectInputStream $O).readObject()
  # ------------------------------------------------------------ Go
  - id: scanoria-go-exec-shell
    languages: [go]
    severity: ERROR
    message: Commande lancée par un shell avec une valeur non constante (injection de commande).
    metadata: { cwe: "CWE-78", severity: high, category: injection }
    patterns:
      - pattern: exec.Command($SH, "-c", $X, ...)
      - pattern-not: exec.Command($SH, "-c", "...", ...)
  - id: scanoria-go-sql-format
    languages: [go]
    severity: ERROR
    message: Requête SQL construite par formatage de chaîne (injection SQL) ; utiliser des paramètres liés.
    metadata: { cwe: "CWE-89", severity: high, category: injection }
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf(...), ...)
      - pattern: $DB.Exec(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf(...), ...)
      - pattern: $DB.Query("..." + $X, ...)
      - pattern: $DB.Exec("..." + $X, ...)
  - id: scanoria-go-tls-insecure
    languages: [go]
    severity: WARNING
    message: Vérification du certificat TLS désactivée.
    metadata: { cwe: "CWE-295", severity: medium, category: crypto }
    pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
  # ------------------------------------------------------------ PHP
  - id: scanoria-php-command-injection
    languages: [php]
    severity: ERROR
    message: Commande système ou code construit depuis une entrée de la requête (injection).
    metadata: { cwe: "CWE-78", severity: high, category: injection }
    patterns:
      - pattern-either:
          - pattern: system(<... $_GET ...>)
          - pattern: system(<... $_POST ...>)
          - pattern: system(<... $_REQUEST ...>)
          - pattern: exec(<... $_GET ...>)
          - pattern: exec(<... $_POST ...>)
          - pattern: shell_exec(<... $_GET ...>)
          - pattern: shell_exec(<... $_POST ...>)
          - pattern: passthru(<... $_GET ...>)
          - pattern: eval(<... $_GET ...>)
          - pattern: eval(<... $_POST ...>)
  - id: scanoria-php-unserialize
    languages: [php]
    severity: ERROR
    message: unserialize sur une entrée de la requête (injection d'objet).
    metadata: { cwe: "CWE-502", severity: high, category: deserialization }
    pattern-either:
      - pattern: unserialize(<... $_GET ...>)
      - pattern: unserialize(<... $_POST ...>)
      - pattern: unserialize(<... $_COOKIE ...>)
      - pattern: unserialize(<... $_REQUEST ...>)
