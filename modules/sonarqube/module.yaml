# Module SonarQube Community Build (service permanent, CLAUDE.md § 5.1).
# Version, empreinte d'image et licence relevées en amont le 2026-11-24 :
# image officielle docker.io/library/sonarqube, étiquette
# 26.11.0.134175-community (index OCI multi-architecture), dépôts
# SonarSource/sonarqube et SonarSource/docker-sonarqube sous LGPL-3.0.
# Contraintes : PostgreSQL, vm.max_map_count ≥ 524288, ≥ 4 Go de RAM pour lui
# seul. La Community Build n'analyse que la branche principale ; l'option
# « branches » (activée par défaut) lève cette limite avec le plugin libre
# mc1arke/sonarqube-community-branch-plugin (LGPL-3.0, non maintenu par
# SonarSource), livré par son auteur dans l'image
# docker.io/mc1arke/sonarqube-with-community-branch-plugin (service.variants).
# Le plugin suit la version majeure.mineure de SonarQube : il n'est retenu que
# s'il est publié pour cette version, sinon l'image officielle est gardée et la
# console dit pourquoi. Au 2026-11-24, le plugin publié s'arrête à 26.10.0 :
# aucune variante n'est encore déclarée pour 26.11.
# Mise en service automatique par le helper (provision.py) : mot de passe
# admin aléatoire (jamais affiché ni en base), utilisateur et jeton d'analyse
# dédiés, authentification forcée. Le verdict reste celui de Scanoria : le
# quality gate SonarQube est laissé par défaut.
id: sonarqube
name: SonarQube Community Build
description:
  fr: Qualité du code et SAST, avec son interface web ; branches et PR avec le plugin de branches quand il est disponible.
  en: Code quality and SAST, with its web interface; branches and pull requests with the branch plugin when available.
type: service
categories: [quality, sast]
license:
  spdx: LGPL-3.0-only
  url: https://github.com/SonarSource/sonarqube/blob/master/LICENSE.txt
  restrictions: none
  verified_at: "2026-11-24"
  notes: Community Build. Seule la branche principale est analysée par l'édition elle-même ; l'option « branches » ajoute l'analyse des branches et des PR par le plugin libre sonarqube-community-branch-plugin (LGPL-3.0), quand une version compatible est publiée.
upstream:
  homepage: https://www.sonarsource.com/products/sonarqube/
  source: https://github.com/SonarSource/sonarqube
image: docker.io/library/sonarqube@sha256:7b2296713a92b8ea0dd7a083a25faadc59376c9a1e6daf2744a89711c54ea1ba
version: "26.11.0.134175"
resources: { min_ram_mb: 4096, min_cpu: 2, disk_mb: 10240 }
hostname: sonarqube
requires: { modules: [], feeds: [], appliance: ">=0.4.0" }
conflicts: []
needs:
  postgres: true
  sysctl:
    vm.max_map_count: 524288
    fs.file-max: 131072
    nofile: 131072
    nproc: 8192
options:
  type: object
  additionalProperties: false
  properties:
    branches:
      type: boolean
      default: true
      title: Analyse des branches et des PR
      description: Ajoute le plugin libre de branches (LGPL-3.0, tiers) quand une version compatible avec ce SonarQube est publiée ; sinon seule la branche principale est analysée.
options_i18n:
  branches:
    fr: { title: Analyse des branches et des PR, description: "Ajoute le plugin libre de branches (LGPL-3.0, tiers) quand une version compatible avec ce SonarQube est publiée ; sinon seule la branche principale est analysée." }
    en: { title: Branch and pull request analysis, description: "Adds the free third-party branch plugin (LGPL-3.0) when a version compatible with this SonarQube is published; otherwise only the main branch is analysed." }
service:
  port: 9000
  health_path: /api/system/status
  units:
    - { name: sonarqube }
  # Fonction optionnelle portée par l'option du même nom ; fournie par une
  # variante d'image compatible (même version de SonarQube, plugin de même
  # majeure.mineure). Gabarit de la variante, à ajouter dès que le plugin
  # 26.11.x est publié (empreinte relevée sur Docker Hub, licence revérifiée) :
  #   variants:
  #     - feature: branches
  #       option: branches
  #       image: docker.io/mc1arke/sonarqube-with-community-branch-plugin@sha256:<empreinte de 26.11.0.134175-community>
  #       version: "26.11.0"            # version du plugin
  #       base_version: "26.11.0.134175" # SonarQube embarqué, égal à version
  #       license: { spdx: LGPL-3.0-only, url: https://github.com/mc1arke/sonarqube-community-branch-plugin/blob/master/LICENSE, verified_at: "AAAA-MM-JJ" }
  #       upstream: { source: https://github.com/mc1arke/sonarqube-community-branch-plugin }
  #       leaves:
  #         - { volume: extensions, dir: plugins, prefix: sonarqube-community-branch-plugin }
  features: [branches]
  variants: []
  volumes:
    - { name: data, path: /opt/sonarqube/data }
    - { name: extensions, path: /opt/sonarqube/extensions }
    - { name: logs, path: /opt/sonarqube/logs }
  backup: [data, extensions, logs]
  env:
    SONAR_JDBC_URL: "{db_url_jdbc}"
    SONAR_JDBC_USERNAME: "{db_user}"
    # Aucun appel sortant : ni télémétrie, ni place de marché des extensions.
    SONAR_TELEMETRY_ENABLE: "false"
    SONAR_UPDATECENTER_ACTIVATE: "false"
  secrets:
    - { name: db-password, env: SONAR_JDBC_PASSWORD }
  # Le mot de passe admin et le jeton d'analyse sont créés par provision.py
  # dans le même répertoire de secrets, sans être montés dans le conteneur.
upgrade: { policy: on-demand }
