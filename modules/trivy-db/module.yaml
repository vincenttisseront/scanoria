#
# Base de vulnérabilités de Trivy (module feed). Depuis la 0.3.4, le helper la
# télécharge à l'installation puis chaque jour (feeds.py : registre OCI,
# empreinte de la couche vérifiée), dans la disposition de « trivy --cache-dir ».
# Sources dans l'ordre de Trivy lui-même : mirror.gcr.io, puis ghcr.io en
# secours (limite de débit). L'import d'un lot hors ligne signé arrive en 0.6
# (CLAUDE.md § 9). Licence relevée le 2026-11-24 sur le dépôt amont.
id: trivy-db
name: Trivy DB
description:
  fr: Base de vulnérabilités hors ligne de Trivy (format trivy-db v2).
  en: Trivy offline vulnerability database (trivy-db v2 format).
type: feed
categories: [sca, container]
license:
  spdx: Apache-2.0
  url: https://github.com/aquasecurity/trivy-db/blob/main/LICENSE
  restrictions: none
  verified_at: "2026-11-24"
  notes: Code sous Apache-2.0 ; les avis agrégés gardent les conditions de leurs sources (NVD, GHSA, distributions).
upstream:
  homepage: https://trivy.dev
  source: https://github.com/aquasecurity/trivy-db
version: "2"
resources: { min_ram_mb: 16, min_cpu: 0.1, disk_mb: 4000 }
hostname: null
requires: { modules: [], feeds: [], appliance: ">=0.2.0" }
conflicts: []
options:
  type: object
  additionalProperties: false
  properties: {}
feed:
  format: trivy-db
  mount: /feeds/trivy-db
  max_age_days: 7
  source: { kind: oci, ref: "mirror.gcr.io/aquasec/trivy-db:2", mirrors: ["ghcr.io/aquasecurity/trivy-db:2"] }
  schedule: daily
