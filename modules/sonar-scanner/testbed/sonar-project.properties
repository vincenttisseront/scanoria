# Réglages hostiles du dépôt analysé : sonar_scan.py doit les ignorer
# (-Dproject.settings vers un fichier vide). S'ils étaient lus, plus aucun
# fichier ne serait analysé et le banc d'essai échouerait.
sonar.exclusions=**/*
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
