#
# Module sonar-scanner : analyse un dépôt avec le service SonarQube installé
# et rapatrie ses issues et hotspots en SARIF 2.1.0 (contrat 12 de la 0.4).
# Image officielle docker.io/sonarsource/sonar-scanner-cli, étiquette
# 12.5.0.4351_8.5.0 (SonarScanner CLI 8.5.0.16571, amd64), relevée en amont le
# 2026-11-24 ; LGPL-3.0 (SonarSource/sonar-scanner-cli et -docker).
# Réseau : uniquement le réseau interne du service sonarqube ; jeton d'analyse
# par secret Podman. Branche par défaut, plus les autres branches quand le
# service sonarqube a la fonction « branches » active (plugin de branches,
# option du module sonarqube) : la branche est passée par SCANORIA_BRANCH à
# sonar-scanner (sonar.branch.name) et les résultats lus sur cette branche.
# Sans la fonction, une autre référence rend le module « skipped », sans effet
# sur le verdict.
# Orchestration et conversion : outil de l'appliance
# /usr/lib/scanoria/scan-tools/sonar (python3 de l'image, bibliothèque standard).
id: sonar-scanner
name: SonarQube (analyse)
description:
  fr: Analyse le dépôt avec SonarQube (branche principale, et autres branches avec le plugin de branches) et rapatrie ses résultats dans la console.
  en: Analyses the repository with SonarQube (main branch, and other branches with the branch plugin) and brings its results into the console.
type: scanner
categories: [quality, sast]
license:
  spdx: LGPL-3.0-only
  url: https://github.com/SonarSource/sonar-scanner-cli/blob/master/LICENSE.txt
  restrictions: none
  verified_at: "2026-11-24"
upstream:
  homepage: https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/scanners/sonarscanner
  source: https://github.com/SonarSource/sonar-scanner-cli-docker
image: docker.io/sonarsource/sonar-scanner-cli@sha256:8bb84373f00346f9a579adb7ccb2999f8cd050ab7167fa9ae08a16069de03c84
version: "8.5.0.16571"
resources: { min_ram_mb: 2048, min_cpu: 1, disk_mb: 1500 }
hostname: null
requires: { modules: [git-fetch, sonarqube], feeds: [], appliance: ">=0.4.0" }
conflicts: []
needs: { sysctl: {}, postgres: false }
options:
  type: object
  additionalProperties: false
  properties: {}
scan:
  inputs: [repo]
  command: ["python3", "-I", "/scanoria/sonar_scan.py", "/out/result.sarif"]
  tool: sonar
  network: service:sonarqube
  refs: default-branch
  refs_feature: branches
  timeout_s: 1800
  # V10 (0.6) : SONAR_USER_HOME gardé par projet (/cache) ; le runner n'en
  # garde que les extensions dont il a vérifié l'empreinte.
  cache: sonar-plugins
  exit_codes_ok: [0]
  severity_map:
    blocker: critical
    critical: high
    high: high
    major: medium
    medium: medium
    minor: low
    low: low
    info: info
outputs:
  sarif: { path: /out/result.sarif, version: "2.1.0" }
testbed:
  path: testbed/
  expect:
    # Règles actives dans le profil par défaut de SonarQube 26.11 (« Sonar way
    # core »), relevées sur une vraie instance par tests/b17-live.sh.
    # Mot de passe en dur (sécurité).
    - { rule: "python:S2068", category: sast, min: 1 }
    # Certificat TLS non vérifié (sécurité).
    - { rule: "python:S4830", category: sast, min: 1 }
    # Auto-affectation d'une variable (fiabilité, qualité).
    - { rule: "python:S1656", category: quality, min: 1 }
    # Conditions identiques dans un if/elif (fiabilité, qualité).
    - { rule: "python:S1862", category: quality, min: 1 }
health: { command: ["python3", "--version"] }
upgrade: { policy: on-demand }
