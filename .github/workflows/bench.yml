#
# Mesure des délais d'analyse (0.6, CLAUDE.md § 15 V1–V10) : trois dépôts
# générés (tests/bench/gen.py) analysés par le vrai runner, bornés à
# 2 vCPU / 4 Go, à froid puis avec le cache de résultats rempli. Le résumé est
# comparé à tests/bench/baseline.json ; une régression de plus de 15 % est
# signalée (résumé et commentaire de PR) sans bloquer : ce travail n'entre pas
# dans ci-ok. La référence n'est mise à jour que par l'intégrateur.
name: Bench

on:
  pull_request:
    paths:
      - src/rootfs/usr/lib/scanoria/py/scanoria/runner.py
      - src/rootfs/usr/lib/scanoria/py/scanoria/schedule.py
      - src/rootfs/usr/lib/scanoria/py/scanoria/resultcache.py
      - src/rootfs/usr/lib/scanoria/py/scanoria/applicability.py
      - src/rootfs/usr/lib/scanoria/py/scanoria/fetch.py
      - src/rootfs/usr/lib/scanoria/py/scanoria/sbom.py
      - webui/server/scans/plan.ts
      - webui/server/scans/order.ts
      - modules/**
      - tests/bench/**
      - .github/workflows/bench.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  measure:
    name: bench (2 vCPU / 4 Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.run.outputs.regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, zstd, python3-yaml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq zstd podman nftables python3-yaml curl openssl
          sudo podman --version
      # Machine jetable : le helper et le runner tournent en root avec le vrai podman (§ 6.4).
      - name: tests/bench/run.sh
        id: run
        run: |
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 GITHUB_SHA="$GITHUB_SHA" bash tests/bench/run.sh "$RUNNER_TEMP/bench"
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/bench"
          grep -E '^regression=(true|false)$' "$RUNNER_TEMP/bench/regression.txt" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/bench/rapport.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: ${{ runner.temp }}/bench/
          if-no-files-found: ignore
          retention-days: 30

  comment:
    name: bench (commentaire de régression)
    needs: measure
    if: github.event_name == 'pull_request' && needs.measure.outputs.regression == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Commentaire sur la PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Bench : régression de plus de 15 % sur les délais d'analyse (signalée, non bloquante). Détail dans le résumé : $RUN_URL"
