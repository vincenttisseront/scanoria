# Copyright (C) 2026 Vincent Tisseront
#
# Intégration continue (docs/CI-CD.md). Le contrôle requis par la protection de
# main est « ci-ok », qui résume tous les travaux ci-dessous. Le test de
# démarrage de l'ISO (installation dans QEMU/KVM) est dans iso.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sur une PR, une nouvelle poussée annule l'exécution dépassée. Sur main, chaque
# commit garde sa CI jusqu'au bout (groupe par SHA) : promote.yml exige un
# ci-ok réussi sur le commit exact du tag.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint (shell, workflows, dépôt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils (versions et empreintes épinglées)
        run: |
          .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" shellcheck actionlint
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Cohérence du dépôt (VERSION, CHANGELOG, clé publique, actions épinglées)
        run: .github/scripts/check-repo.sh
      - name: shellcheck
        run: .github/scripts/lint-shell.sh
      - name: actionlint
        run: actionlint -color
      - name: Chaîne de signature (clés jetables)
        run: .github/scripts/test-release-chain.sh

  gitleaks:
    name: gitleaks (tout l'historique)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" gitleaks
          # Tout l'historique du commit testé (pas les autres branches : chacune
          # est analysée par sa propre CI, et main entière à chaque push).
          "$RUNNER_TEMP/tools/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --log-opts=HEAD .

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Les bancs d'essai des modules (modules/<id>/testbed/, F12) figent
      # volontairement des dépendances vulnérables : ils sont exclus (motif
      # absolu, la recherche part de « / »), jamais le reste du dépôt.
      - name: osv-scanner (exceptions datées dans osv-scanner.toml)
        run: |
          .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" osv-scanner
          "$RUNNER_TEMP/tools/osv-scanner" scan source --config osv-scanner.toml --recursive \
            --x-exclude 'r:/modules/[^/]+/testbed$' .

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Seule exception : minimist 1.2.5, figé volontairement dans les bancs
          # d'essai modules/{osv-scanner,trivy}/testbed/ (F12, docs/MODULES.md).
          # Avis unique de cette version ; à retirer si le banc d'essai change.
          allow-ghsas: GHSA-xvch-5gv4-984h

  console:
    name: console (lint, types, tests, construction)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # postgres:16, épinglée par empreinte (relevée le 2026-11-23).
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          # Base jetable du runner, joignable seulement en local : pas de mot de passe.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      NUXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Locale de la base (en_US.UTF-8)
        run: |
          psql "$DATABASE_URL" -Atc "SELECT datcollate FROM pg_database WHERE datname = 'postgres'" \
            | grep -qx 'en_US.UTF-8'
      # Sans scripts d'installation des dépendances ; seule la préparation Nuxt
      # (postinstall du projet) est lancée explicitement.
      - run: npm ci --ignore-scripts
      - run: npm run postinstall
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitaires et d'intégration (couverture lcov)
        run: >-
          npm run test --
          --coverage.enabled=true
          --coverage.provider=v8
          --coverage.reporter=lcov
          --coverage.reporter=text-summary
          --coverage.reportsDirectory=coverage
      - run: npm run build
      - name: Tests de bout en bout (serveur construit)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-console
          path: webui/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  batteries:
    name: batteries shell (sans root)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dépendances des batteries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            jq zstd xorriso gnupg openssl python3-yaml python3-jsonschema python3-numpy
          .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" shellcheck
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: tests/b*.sh
        run: .github/scripts/run-batteries.sh
      - name: Contrôles réservés à root (nginx -t, nft -c dans b03 et b04)
        run: |
          sudo apt-get install -y -q --no-install-recommends nginx nftables
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b03-ca.sh
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b04-system-static.sh
          sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b13-routing.sh

  iso-build:
    name: construction (lot et ISO, sans démarrage)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Place disque
        run: .github/scripts/free-disk-space.sh
      - name: Cache des téléchargements vérifiés (ISO de base, Node.js, paquets)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cache
          key: iso-cache-${{ hashFiles('src/iso/*.env', 'src/iso/packages.list') }}
      - name: ./build.sh --iso
        run: ./build.sh --iso --engine docker
      - name: Batteries de construction (lot et ISO produits)
        env:
          SCANORIA_OUT: ${{ github.workspace }}/out
        # b21 contrôle le lot et l'ISO produits ; b30 signe et vérifie le lot
        # produit avec des clés jetables (test-release-chain.sh).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            jq zstd xorriso gnupg openssl python3-yaml python3-jsonschema
          .github/scripts/install-tools.sh "$RUNNER_TEMP/tools" shellcheck
          PATH="$RUNNER_TEMP/tools:$PATH"
          .github/scripts/run-batteries.sh 'b2[0-9]-*.sh'
          .github/scripts/run-batteries.sh 'b3[0-9]-*.sh'
      - name: Lot de mise à jour (artefact, non signé)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-unsigned
          path: |
            out/scanoria-*.tar.zst
            out/release.json
            out/SHA256SUMS
            out/scanoria-*-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [console]
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-console
          path: webui/coverage
      # Seule une PR venant d'un fork peut se passer du jeton (les secrets n'y
      # sont pas transmis) ; partout ailleurs, un jeton absent fait échouer ci-ok.
      - name: Jeton absent (PR depuis un fork)
        if: env.SONAR_TOKEN == '' && github.event.pull_request.head.repo.fork == true
        run: echo "::notice::SONAR_TOKEN indisponible ; l'analyse SonarQube Cloud de cette PR est faite après fusion."
      - name: Jeton absent hors PR de fork
        if: env.SONAR_TOKEN == '' && github.event.pull_request.head.repo.fork != true
        run: |
          echo "::error::SONAR_TOKEN absent : l'analyse SonarQube Cloud et son quality gate sont obligatoires."
          exit 1
      - name: Analyse et quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      # Diagnostic : conditions du quality gate et issues ouvertes, lues par
      # l'API de SonarQube Cloud, dans le journal et le résumé du travail.
      - name: Détail du quality gate
        if: always() && env.SONAR_TOKEN != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: .github/scripts/sonar-report.sh

  modules-testbed-live:
    # Chaque scanner du catalogue sur son banc d'essai, en vrai conteneur Podman
    # confiné (CLAUDE.md § 6.4, F12) : tests/b10-live.sh. Hors de ci-ok
    # (optionnel) : il dépend des registres d'images et de l'export OSV.
    name: modules (bancs d'essai, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq python3-yaml python3-jsonschema
          podman --version
      - name: tests/b10-live.sh
        run: bash tests/b10-live.sh

  modules-live:
    name: modules-live (podman réel, b12-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, zstd)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq zstd podman
          sudo podman --version
      # Machine jetable : le helper tourne en root avec le vrai podman (§ 6.4).
      - name: tests/b12-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b12-live.sh

  runner-live:
    name: runner-live (podman et nftables réels, b14-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, nftables, jq, python3-yaml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark nftables python3-yaml git curl openssl
          sudo podman --version
          sudo podman info --format '{{.Host.NetworkBackend}}'
      # Machine jetable : le runner tourne en root avec le vrai podman et le vrai
      # nftables (§ 6.4, réseau de récupération limité à la forge).
      - name: tests/b14-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b14-live.sh

  execution-live:
    name: execution-live (miroir Git, tmpfs, bases louées, images préchargées, b27-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, nftables, jq, python3-yaml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark nftables python3-yaml git curl openssl
          sudo podman --version
      # Machine jetable : vrais conteneurs, vrai tmpfs, vraie forge HTTPS locale (V1, V2, V7, V9).
      - name: tests/b27-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b27-live.sh

  feeds-live:
    # Le test qui aurait attrapé le code 127 de la 0.3.3 : OSV-Scanner et Trivy
    # installés par le helper à partir de bases vides, téléchargées par
    # l'appliance elle-même depuis leurs vraies sources (tests/b18-live.sh).
    name: feeds-live (bases téléchargées par le helper, b18-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, zstd, python3-yaml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq zstd podman python3-yaml curl openssl
          sudo podman --version
      # Machine jetable : le helper tourne en root avec le vrai podman (§ 6.4).
      - name: tests/b18-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b18-live.sh
      # EPSS et KEV (0.5, H3) depuis leurs vraies sources, racine vide.
      - name: tests/b23-vuln-intel.sh --live
        run: bash tests/b23-vuln-intel.sh --live

  services-live:
    name: services-live (podman, systemd, PostgreSQL réels, b16-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, PostgreSQL 16, jq)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark postgresql-16 curl openssl
          sudo podman --version
      # Machine jetable : le helper tourne en root avec le vrai podman, le vrai
      # générateur Quadlet de systemd et le vrai PostgreSQL (modules « service »).
      - name: tests/b16-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b16-live.sh

  sonarqube-live:
    # SonarQube Community Build réel et sonar-scanner sur son banc d'essai
    # (chantier B de la 0.4) : réglages noyau, mise en service par le helper,
    # jeton en secret Podman, réseau interne seul, SARIF validé. La RAM de la
    # machine est mesurée et affichée dans le journal.
    name: sonarqube-live (SonarQube réel, b17-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, python3-yaml, python3-jsonschema)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark aardvark-dns python3-yaml python3-jsonschema curl
          sudo podman --version
          free -m
      # Machine jetable : sysctl, podman et secrets Podman en root (§ 3.2, § 6.4).
      - name: tests/b17-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b17-live.sh

  sbom-live:
    # SBOM de la 0.5 (chantier A) sur une appliance neuve : Syft, Grype et sa
    # base grype-db téléchargée depuis Anchore, Dependency-Track réel, analyse
    # complète d'une archive et ingestion par la console (tests/b19-live.sh).
    name: sbom-live (Syft, Grype, Dependency-Track réels, b19-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Dépendances (podman, PostgreSQL 16, jq, zstd, console)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark aardvark-dns postgresql-16 \
            python3-yaml python3-jsonschema curl openssl zstd
          sudo podman --version
          free -m
          cd webui && npm ci --ignore-scripts && npm run postinstall
      # Machine jetable : helper et runner en root avec le vrai podman, Quadlet,
      # PostgreSQL et les vraies sources (images épinglées, base Grype).
      - name: tests/b19-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b19-live.sh

  reach-live:
    # Module reach-index (chantier D de la 0.5, I11) lancé par le vrai runner
    # avec le vrai podman, confiné comme sur l'appliance (tests/b24-live.sh).
    name: reach-live (reach-index par le runner, b24-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, python3-yaml, python3-jsonschema)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq podman netavark nftables python3-yaml python3-jsonschema curl
          sudo podman --version
      # Machine jetable : le runner tourne en root avec le vrai podman (§ 6.4).
      - name: tests/b24-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b24-live.sh

  bundle-live:
    # Lot hors ligne réel (chantier A de la 0.6) : export par une appliance
    # connectée, import et installation par une appliance sans réseau
    # (unshare --net), banc d'essai réussi (tests/b25-live.sh).
    name: bundle-live (lot hors ligne réel, b25-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, skopeo, jq, zstd, python3-yaml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq zstd podman skopeo python3-yaml curl openssl util-linux
          sudo podman --version
          sudo skopeo --version
      # Machine jetable : le helper tourne en root avec le vrai podman et le vrai skopeo.
      - name: tests/b25-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b25-live.sh

  modelscan-live:
    # Module modelscan (chantier E de la 0.6, K8) : banc d'essai (F12) et
    # analyse d'un dépôt piégé par le vrai runner avec le vrai podman, dans
    # l'image épinglée, confiné comme sur l'appliance (tests/b29-live.sh).
    name: modelscan-live (ModelScan par le runner, b29-live)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances (podman, jq, zstd, python3-yaml, python3-jsonschema)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends jq zstd podman netavark nftables python3-yaml python3-jsonschema curl
          sudo podman --version
      # Machine jetable : le runner tourne en root avec le vrai podman (§ 6.4).
      - name: tests/b29-live.sh
        run: sudo env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 bash tests/b29-live.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, gitleaks, osv-scanner, dependency-review, console, batteries, iso-build, sonarqube, modules-live, runner-live, feeds-live, services-live, sonarqube-live, sbom-live, reach-live, modelscan-live, execution-live, bundle-live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Résumé
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Seul dependency-review peut être « skipped » (hors PR).
          bad=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result != "success"
                and ((.key == "dependency-review" and .value.result == "skipped") | not))
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::travaux en échec, annulés ou sautés : $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "ci-ok : tous les travaux ont réussi"
