#
# Images d'outils construites par la CI de Scanoria (0.7, docs/MODULES.md § 7) :
# un module dont l'amont ne publie aucune image de conteneur livre
# modules/<id>/image/Containerfile. En PR, chaque image est construite (sans
# rien pousser) ; sur main, les images modifiées sont poussées vers
# ghcr.io/vincenttisseront/scanoria-<id>:<version>, avec une attestation de
# provenance, et leur empreinte est affichée dans le résumé du travail. Une PR
# de suivi pose ensuite « image: …@sha256:… » dans module.yaml et retire
# image_pending : le catalogue ne référence jamais une étiquette.
name: Images d'outils

on:
  pull_request:
    paths:
      - "modules/*/image/**"
      - ".github/workflows/tool-images.yml"
  push:
    branches: [main]
    paths:
      - "modules/*/image/**"
  workflow_dispatch:
    inputs:
      module:
        description: "Identifiant du module (vide : toutes les images)"
        required: false
        default: ""

concurrency:
  group: tool-images-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  discover:
    name: découverte des images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Modules à construire
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          ONLY: ${{ github.event.inputs.module }}
        run: |
          set -euo pipefail
          all=$(find modules -mindepth 3 -maxdepth 3 -path 'modules/*/image/Containerfile' | cut -d/ -f2 | LC_ALL=C sort)
          case "$EVENT" in
            workflow_dispatch)
              if [[ -n "$ONLY" ]]; then
                if ! [[ "$ONLY" =~ ^[a-z0-9][a-z0-9-]{1,40}$ ]] || ! grep -qx -- "$ONLY" <<< "$all"; then
                  echo "module inconnu : $ONLY" >&2
                  exit 1
                fi
                all=$ONLY
              fi
              ;;
            push | pull_request)
              base=${BEFORE:-}
              [[ "$EVENT" == pull_request ]] && base=$BASE
              if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2> /dev/null; then
                changed=$(git diff --name-only "$base" HEAD -- 'modules/*/image/**' | cut -d/ -f2 | LC_ALL=C sort -u)
                # Une PR qui ne change que ce workflow construit toutes les images.
                if [[ "$EVENT" == push || -n "$changed" ]]; then all=$(comm -12 <(echo "$all") <(echo "$changed")); fi
              fi
              ;;
          esac
          json=$(printf '%s\n' "$all" | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "modules=$json" >> "$GITHUB_OUTPUT"
          echo "Images : $json"

  build:
    name: image ${{ matrix.module }}
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Contrôle du Containerfile
        env:
          MODULE: ${{ matrix.module }}
        run: |
          sudo apt-get install -y -q --no-install-recommends python3-yaml python3-jsonschema > /dev/null
          python3 tests/lib/modcheck.py containerfile "modules/$MODULE/image/Containerfile" "$MODULE"
      - name: Vérification amont (verify.sh facultatif)
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if [[ -f "modules/$MODULE/image/verify.sh" ]]; then
            (cd "modules/$MODULE/image" && bash ./verify.sh)
          else
            echo "aucun verify.sh pour $MODULE"
          fi
      - name: Construction (reproductible autant que possible)
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "modules/$MODULE/module.yaml")
          # Une étiquette OCI n'admet pas « + » (version 1.0+build).
          tag=${version//+/_}
          epoch=$(git log -1 --format=%ct -- "modules/$MODULE/image")
          podman build --pull=always --timestamp "$epoch" --build-arg "SOURCE_DATE_EPOCH=$epoch" \
            --label "io.scanoria.build.commit=$GITHUB_SHA" \
            -t "localhost/scanoria-$MODULE:$tag" "modules/$MODULE/image"
          podman save --format oci-archive -o "$RUNNER_TEMP/image.tar" "localhost/scanoria-$MODULE:$tag"
          {
            echo "### $MODULE $version"
            echo "- image locale : \`localhost/scanoria-$MODULE:$tag\`"
            echo "- identifiant : \`$(podman image inspect --format '{{.Id}}' "localhost/scanoria-$MODULE:$tag")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fumée (outil présent, utilisateur non root, aucun réseau)
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "modules/$MODULE/module.yaml")
          # Une étiquette OCI n'admet pas « + » (version 1.0+build).
          tag=${version//+/_}
          mapfile -t health < <(python3 -c 'import sys, yaml
          h = (yaml.safe_load(open(sys.argv[1])).get("health") or {}).get("command") or []
          print("\n".join(h))' "modules/$MODULE/module.yaml")
          uid=$(podman run --rm --network=none --entrypoint id "localhost/scanoria-$MODULE:$tag" -u)
          [[ "$uid" == 65534 ]] || { echo "utilisateur $uid au lieu de 65534" >&2; exit 1; }
          if [[ ${#health[@]} -gt 0 ]]; then
            podman run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
              --tmpfs /tmp --env HOME=/tmp --entrypoint "${health[0]}" "localhost/scanoria-$MODULE:$tag" "${health[@]:1}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: tool-image-${{ matrix.module }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publication ${{ matrix.module }}
    needs: [discover, build]
    # Jamais depuis une PR ni hors de main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-image-${{ matrix.module }}
          path: ${{ runner.temp }}
      - name: Poussée vers ghcr.io (image construite par le travail précédent)
        id: push
        env:
          MODULE: ${{ matrix.module }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "modules/$MODULE/module.yaml")
          # Une étiquette OCI n'admet pas « + » (version 1.0+build).
          tag=${version//+/_}
          repo="ghcr.io/${OWNER,,}/scanoria-$MODULE"
          printf '%s' "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman load -i "$RUNNER_TEMP/image.tar"
          podman tag "localhost/scanoria-$MODULE:$tag" "$repo:$tag"
          podman push --digestfile "$RUNNER_TEMP/digest" "$repo:$tag"
          podman logout ghcr.io
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "empreinte inattendue : $digest" >&2; exit 1; }
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### $MODULE $version publiée"
            echo "À épingler dans modules/$MODULE/module.yaml (PR de suivi, en retirant image_pending) :"
            echo '```yaml'
            echo "image: $repo@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
