#
# SonarQube Cloud (gratuit pour un dépôt public). Analyse lancée par la CI
# (ci.yml, travail « SonarQube Cloud », secret SONAR_TOKEN) : désactiver
# l'« Automatic Analysis » dans SonarQube Cloud.
#
# À VÉRIFIER dans SonarQube Cloud (Administration > Update key / Organization)
# avant la première analyse : organisation et clé de projet ci-dessous.
sonar.organization=vincenttisseront
sonar.projectKey=vincenttisseront_scanoria
sonar.projectName=Scanoria

sonar.sourceEncoding=UTF-8
# Nouvelle portée d'analyse de SonarQube Cloud : tout le dépôt est analysé,
# sonar.sources/sonar.tests n'ont plus d'effet. On restreint par exclusions.
sonar.exclusions=**/node_modules/**,webui/.nuxt/**,webui/.output/**,webui/coverage/**,out/**

# Couverture de la console (vitest, rapport lcov produit par le travail « console »).
sonar.javascript.lcov.reportPaths=webui/coverage/lcov.info
# Le code de test (batteries shell, tests vitest et e2e) et les workflows ne sont
# pas du code à couvrir ; le code système (src/, Python et shell) est couvert par
# les batteries tests/b*.sh, qui ne produisent pas de rapport de couverture ;
# de même pour catalog/build.py (outil de construction, couvert par b11).
sonar.coverage.exclusions=src/**,build.sh,make-iso.ps1,webui/migrate.mjs,webui/i18n/**,**/*.config.ts,**/*.config.mjs,tests/**,webui/tests/**,.github/**,catalog/**

# Duplication : les tests (cas hostiles volontairement répétitifs), les
# traductions fr/en (mêmes clés) et les schémas JSON de demandes (même enveloppe)
# sont structurellement répétitifs.
sonar.cpd.exclusions=tests/**,webui/tests/**,webui/i18n/**,src/rootfs/usr/share/scanoria/requests/**,src/rootfs/usr/share/scanoria/schemas/**,catalog/tests/**,catalog/schema/**

sonar.python.version=3.12
